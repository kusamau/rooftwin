<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" viewBox="0 0 1600 870" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
    <style>
      .t { font-size: 17px; fill: #111827; font-weight: 600; }
      .s { font-size: 13.5px; fill: #4B5563; }
      .lane { font-size: 13px; fill: #6B7280; font-weight: 700; letter-spacing: 1.5px; }
      .tag { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .box { fill: #F9FAFB; stroke: #D1D5DB; stroke-width: 1.5; }
      .phys { fill: #EFF6FF; stroke: #93C5FD; stroke-width: 1.5; }
      .now { fill: #FEF3C7; stroke: #D97706; stroke-width: 3; }
      .ln { stroke: #9CA3AF; stroke-width: 2; fill: none; }
      .lnA { stroke: #B45309; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="870" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="52" font-size="30" font-weight="700" fill="#111827">rooftwin — target architecture (week 10)</text>
  <text x="40" y="82" font-size="16" fill="#4B5563">A learning-grade digital twin of a 500 Wp Victron solar + 3-battery lead-acid system. Amber = built in Lesson 1.</text>

  <!-- Lane headers -->
  <text class="lane" x="40" y="128">PHYSICAL</text>
  <text class="lane" x="330" y="128">EDGE</text>
  <text class="lane" x="610" y="128">BROKER</text>
  <text class="lane" x="890" y="128">TWIN PLATFORM</text>
  <text class="lane" x="1190" y="128">MODELS</text>
  <text class="lane" x="1420" y="128">USERS</text>

  <!-- Physical -->
  <rect class="phys" x="40" y="145" width="230" height="78" rx="10"/>
  <text class="t" x="56" y="178">PV array</text><text class="s" x="56" y="201">~500 Wp, roof</text>
  <rect class="phys" x="40" y="238" width="230" height="78" rx="10"/>
  <text class="t" x="56" y="271">SmartSolar MPPT</text><text class="s" x="56" y="294">100/30 · BLE</text>
  <rect class="phys" x="40" y="331" width="230" height="78" rx="10"/>
  <text class="t" x="56" y="364">SmartShunt</text><text class="s" x="56" y="387">bank current, SoC · BLE</text>
  <rect class="phys" x="40" y="424" width="230" height="78" rx="10"/>
  <text class="t" x="56" y="457">Battery bank</text><text class="s" x="56" y="480">3 × lead-acid, parallel, 12 V</text>
  <rect class="phys" x="40" y="517" width="230" height="78" rx="10"/>
  <text class="t" x="56" y="550">Inverter 300 W</text><text class="s" x="56" y="573">step-load · isOn (manual)</text>

  <!-- Edge -->
  <rect class="box" x="330" y="230" width="220" height="110" rx="10"/>
  <text class="t" x="346" y="264">BLE → MQTT bridge</text>
  <text class="s" x="346" y="288">victron-ble, host network</text>
  <rect x="346" y="304" width="38" height="22" rx="5" fill="#6B7280"/><text class="tag" x="354" y="320">L3</text>
  <rect class="box" x="330" y="370" width="220" height="110" rx="10"/>
  <text class="t" x="346" y="404">Replay + recorder</text>
  <text class="s" x="346" y="428">Parquet, 1× / 10× / 100×</text>
  <rect x="346" y="444" width="38" height="22" rx="5" fill="#6B7280"/><text class="tag" x="354" y="460">L3</text>

  <!-- Broker (Lesson 1) -->
  <rect class="now" x="610" y="265" width="220" height="140" rx="10"/>
  <text class="t" x="626" y="300">Mosquitto 2.x</text>
  <text class="s" x="626" y="324">MQTT · healthcheck</text>
  <text class="s" x="626" y="346">127.0.0.1 only (L1)</text>
  <rect x="626" y="364" width="38" height="22" rx="5" fill="#D97706"/><text class="tag" x="634" y="380">L1</text>
  <rect class="now" x="610" y="425" width="220" height="80" rx="10"/>
  <text class="t" x="626" y="458">Smoke test</text>
  <text class="s" x="626" y="481">smoke-pub → smoke-sub</text>

  <!-- Twin platform -->
  <rect class="box" x="890" y="145" width="240" height="86" rx="10"/>
  <text class="t" x="906" y="178">twin-api</text><text class="s" x="906" y="201">Spring Boot ingest + REST</text>
  <rect x="1078" y="157" width="38" height="22" rx="5" fill="#6B7280"/><text class="tag" x="1086" y="173">L3</text>
  <rect class="box" x="890" y="246" width="240" height="86" rx="10"/>
  <text class="t" x="906" y="279">Eclipse Ditto</text><text class="s" x="906" y="302">Things, features, policies</text>
  <rect x="1078" y="258" width="38" height="22" rx="5" fill="#6B7280"/><text class="tag" x="1086" y="274">L4</text>
  <rect class="box" x="890" y="347" width="240" height="86" rx="10"/>
  <text class="t" x="906" y="380">InfluxDB</text><text class="s" x="906" y="403">time series, retention</text>
  <rect x="1078" y="359" width="38" height="22" rx="5" fill="#6B7280"/><text class="tag" x="1086" y="375">L4</text>
  <rect class="now" x="890" y="448" width="240" height="86" rx="10"/>
  <text class="t" x="906" y="481">twin-core</text><text class="s" x="906" y="504">Java 21 specs + tests</text>
  <rect x="1078" y="460" width="38" height="22" rx="5" fill="#D97706"/><text class="tag" x="1086" y="476">L1</text>
  <rect class="box" x="890" y="549" width="240" height="70" rx="10"/>
  <text class="t" x="906" y="578">DTDL v3 · AAS</text><text class="s" x="906" y="600">information model</text>
  <rect x="1078" y="561" width="38" height="22" rx="5" fill="#6B7280"/><text class="tag" x="1086" y="577">L2</text>

  <!-- Models -->
  <rect class="box" x="1190" y="145" width="190" height="86" rx="10"/>
  <text class="t" x="1206" y="178">twin-physics</text><text class="s" x="1206" y="201">PV · MPPT · 3 batteries</text>
  <rect x="1206" y="207" width="38" height="20" rx="5" fill="#6B7280"/><text class="tag" x="1214" y="222">L5</text>
  <rect class="box" x="1190" y="246" width="190" height="86" rx="10"/>
  <text class="t" x="1206" y="279">twin-analytics</text><text class="s" x="1206" y="302">forecast · anomaly · SoH</text>
  <rect x="1206" y="308" width="38" height="20" rx="5" fill="#6B7280"/><text class="tag" x="1214" y="323">L6</text>
  <rect class="box" x="1190" y="347" width="190" height="86" rx="10"/>
  <text class="t" x="1206" y="380">Optimizer</text><text class="s" x="1206" y="403">what-if · shadow mode</text>
  <rect x="1206" y="409" width="38" height="20" rx="5" fill="#6B7280"/><text class="tag" x="1214" y="424">L8</text>
  <rect class="box" x="1190" y="448" width="190" height="86" rx="10"/>
  <text class="t" x="1206" y="481">Jupyter</text><text class="s" x="1206" y="504">training → ONNX</text>
  <rect x="1206" y="510" width="38" height="20" rx="5" fill="#6B7280"/><text class="tag" x="1214" y="525">L6</text>

  <!-- Users -->
  <rect class="box" x="1420" y="145" width="150" height="86" rx="10"/>
  <text class="t" x="1436" y="178">Grafana</text><text class="s" x="1436" y="201">per persona</text>
  <rect x="1436" y="207" width="38" height="20" rx="5" fill="#6B7280"/><text class="tag" x="1444" y="222">L7</text>
  <rect class="box" x="1420" y="246" width="150" height="86" rx="10"/>
  <text class="t" x="1436" y="279">3D house</text><text class="s" x="1436" y="302">sun + Sankey</text>
  <rect x="1436" y="308" width="38" height="20" rx="5" fill="#6B7280"/><text class="tag" x="1444" y="323">L7</text>
  <rect class="box" x="1420" y="347" width="150" height="86" rx="10"/>
  <text class="t" x="1436" y="380">Human</text><text class="s" x="1436" y="403">approves actions</text>
  <rect x="1436" y="409" width="38" height="20" rx="5" fill="#6B7280"/><text class="tag" x="1444" y="424">L8</text>
  <text class="s" x="1420" y="460" font-style="italic">No actuation of the</text>
  <text class="s" x="1420" y="478" font-style="italic">real Victron devices.</text>

  <!-- Arrows -->
  <path class="ln" d="M270 277 L330 277" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  <path class="ln" d="M270 370 L300 370 L300 300 L330 300" marker-end="url(#arr)" stroke-dasharray="6 4"/>
  <text class="s" x="282" y="262" font-size="12">BLE</text>
  <path class="ln" d="M550 285 L610 305" marker-end="url(#arr)"/>
  <path class="ln" d="M550 425 L610 375" marker-end="url(#arr)"/>
  <path class="ln" d="M830 300 L860 300 L860 188 L890 188" marker-end="url(#arr)"/>
  <path class="ln" d="M830 320 L890 289" marker-end="url(#arr)"/>
  <path class="ln" d="M1010 231 L1010 246" marker-end="url(#arr)"/>
  <path class="ln" d="M1010 332 L1010 347" marker-end="url(#arr)"/>
  <path class="ln" d="M1130 289 L1190 289" marker-end="url(#arr)"/>
  <path class="ln" d="M1130 390 L1190 390" marker-end="url(#arr)"/>
  <path class="ln" d="M1130 188 L1190 188" marker-end="url(#arr)"/>
  <path class="ln" d="M1380 188 L1420 188" marker-end="url(#arr)"/>
  <path class="ln" d="M1380 289 L1420 289" marker-end="url(#arr)"/>
  <path class="ln" d="M1380 390 L1420 390" marker-end="url(#arr)"/>
  <path class="lnA" d="M720 405 L720 425" marker-end="url(#arrA)"/>

  <!-- Cross-cutting bands -->
  <rect class="box" x="40" y="650" width="760" height="64" rx="10"/>
  <text class="t" x="56" y="689">Security: mTLS on MQTT · Keycloak OIDC · OPA policies · STRIDE</text>
  <rect x="740" y="671" width="42" height="22" rx="5" fill="#6B7280"/><text class="tag" x="748" y="687">L9</text>
  <rect class="box" x="820" y="650" width="750" height="64" rx="10"/>
  <text class="t" x="836" y="689">Platform: Compose → k3d · Helm · OpenTelemetry · Prometheus</text>
  <rect x="1508" y="671" width="46" height="22" rx="5" fill="#6B7280"/><text class="tag" x="1514" y="687">L10</text>
  <rect class="now" x="40" y="730" width="1530" height="58" rx="10"/>
  <text class="t" x="56" y="766">CI (GitHub Actions): mvn verify (tests · Spotless · Checkstyle) + docker compose config + MQTT smoke round-trip</text>
  <rect x="1508" y="748" width="38" height="22" rx="5" fill="#D97706"/><text class="tag" x="1516" y="764">L1</text>

  <!-- Legend -->
  <rect class="now" x="40" y="822" width="26" height="20" rx="4"/><text class="s" x="76" y="838">Built in Lesson 1</text>
  <rect class="box" x="230" y="822" width="26" height="20" rx="4"/><text class="s" x="266" y="838">Planned (badge = lesson)</text>
  <rect class="phys" x="460" y="822" width="26" height="20" rx="4"/><text class="s" x="496" y="838">Physical asset</text>
  <line x1="640" y1="832" x2="690" y2="832" class="ln" stroke-dasharray="6 4"/><text class="s" x="700" y="838">Bluetooth LE</text>
  <text class="s" x="1180" y="838">github.com/kusamau/rooftwin</text>
</svg>
