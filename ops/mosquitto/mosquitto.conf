# Eclipse Mosquitto 2.x - rooftwin broker, Lesson 1 configuration.
#
# Mosquitto 2.x only listens on localhost unless a listener is declared explicitly,
# so we declare one. Inside the container network the other services reach it as
# mosquitto:1883; on the host, compose publishes it on 127.0.0.1 only.
listener 1883 0.0.0.0

# Anonymous access is a deliberate Lesson 1 shortcut, kept safe by publishing the
# port on 127.0.0.1 only (see compose/docker-compose.yml).
# Lesson 9 replaces this with mTLS client certificates and per-client ACLs.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

# Publish $SYS broker statistics every 10 s (used by the healthcheck).
sys_interval 10

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
